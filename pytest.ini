# This repository is dotfiles plus tests, not an installable Python package --
# hence pytest.ini rather than a pyproject.toml carrying nothing but this table.
#
# Keeping an ini file here is load-bearing: it pins pytest's rootdir, and
# without testpaths a bare `pytest` would also try to collect the helper scripts
# under home/dot_claude/skills/.
[pytest]
testpaths = tests
addopts = -v
