# Portable Codex safety defaults. The installer merges this block into the
# existing app-managed ~/.codex/config.toml without replacing unrelated state.
default_permissions = "dotfiles"
permissions.dotfiles.description = "Workspace access with common credential files denied"
permissions.dotfiles.extends = ":workspace"
permissions.dotfiles.filesystem.":workspace_roots"."**/.env" = "deny"
permissions.dotfiles.filesystem.":workspace_roots"."**/.env.*" = "deny"
permissions.dotfiles.filesystem.":workspace_roots"."**/secrets/**" = "deny"
permissions.dotfiles.filesystem.":workspace_roots"."**/.codex/auth.json" = "deny"
permissions.dotfiles.filesystem."/Users/*/.extra" = "deny"
permissions.dotfiles.filesystem."/Users/*/.extrarc" = "deny"
permissions.dotfiles.filesystem."/Users/*/.aws/credentials" = "deny"
permissions.dotfiles.filesystem."/Users/*/.claude/.credentials.json" = "deny"
permissions.dotfiles.filesystem."/Users/*/.codex/auth.json" = "deny"
permissions.dotfiles.filesystem."/home/*/.extra" = "deny"
permissions.dotfiles.filesystem."/home/*/.extrarc" = "deny"
permissions.dotfiles.filesystem."/home/*/.aws/credentials" = "deny"
permissions.dotfiles.filesystem."/home/*/.claude/.credentials.json" = "deny"
permissions.dotfiles.filesystem."/home/*/.codex/auth.json" = "deny"
permissions.dotfiles.filesystem."/root/.extra" = "deny"
permissions.dotfiles.filesystem."/root/.extrarc" = "deny"
permissions.dotfiles.filesystem."/root/.aws/credentials" = "deny"
permissions.dotfiles.filesystem."/root/.claude/.credentials.json" = "deny"
permissions.dotfiles.filesystem."/root/.codex/auth.json" = "deny"
