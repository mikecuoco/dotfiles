# agents/skills.toml — GPTomics bioSkills configuration.
#
# First-party skills are not listed here: they live in the chezmoi source at
# home/dot_claude/skills/ and are installed by `chezmoi apply` like any other
# managed file.
#
# Usage:
#   dotfiles skills install    # install the selected categories
#   dotfiles skills update     # re-pull the repository and refresh
#   dotfiles skills status     # show what is installed

# Categories to install. An empty list installs everything — 562 skills across
# 65 categories.
#
# Skill discovery loads every installed skill's name and description into the
# agent's context. At time of writing that is roughly 71,000 estimated tokens
# for the full set. If that proves too heavy, narrow it here rather than by
# deleting installed directories: `dotfiles skills install` prunes anything no
# longer selected, so removing a category actually uninstalls it.
#
#   categories = ["single-cell", "read-qc", "differential-expression"]
#
# Declared before [repo] on purpose — a bare key after a table header would be
# parsed as part of that table.
categories = []

[repo]
url = "https://github.com/GPTomics/bioSkills"
