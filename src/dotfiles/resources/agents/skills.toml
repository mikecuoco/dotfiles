# agents/skills.toml — shared agent skill configuration.
#
# Declares which GPTomics bioSkills categories to install alongside the
# first-party directories bundled under agents/skills/. GPTomics skills
# are fetched and installed for both Claude Code and Codex using the portable
# bio-<category>-<skill>/SKILL.md directory layout.
#
# Usage:
#   dotfiles skills install                    # bundled + default GPTomics group
#   dotfiles skills install --with spatial     # default + spatial
#   dotfiles skills install --with all         # everything (561 skills)
#   dotfiles skills update                     # re-pull and refresh changed files
#   dotfiles skills status                     # show bundled and bio-* skills

# ── Source repository ─────────────────────────────────────────────────────────
[repo]
url = "https://github.com/GPTomics/bioSkills"

# ── Default group ──────────────────────────────────────────────────────────────
# Core skills for RNA-seq and single-cell analysis workflows.
# Installed automatically by: dotfiles skills install
[groups.default]
description = "Core RNA-seq and single-cell analysis skills"
categories = [
    "single-cell",
    "read-qc",
    "differential-expression",
    "rna-quantification",
    "sequence-io",
    "machine-learning",
    "data-visualization",
]

# ── Spatial group ─────────────────────────────────────────────────────────────
# Spatial transcriptomics skills.
# Install with: dotfiles skills install --with spatial
[groups.spatial]
description = "Spatial transcriptomics skills"
categories = [
    "spatial-transcriptomics",
]

# ── Genomics group ────────────────────────────────────────────────────────────
# Genome-level analysis skills.
# Install with: dotfiles skills install --with genomics
[groups.genomics]
description = "Genome-level analysis: variant calling, alignment, copy-number"
categories = [
    "variant-calling",
    "alignment",
    "copy-number",
]

# ── All group ─────────────────────────────────────────────────────────────────
# Install every available bioSkills category (561 skills across 63 categories).
# Install with: dotfiles skills install --with all
# Note: installs to ~/.claude/skills/ and ~/.agents/skills/ — large context footprint.
[groups.all]
description = "All 63 bioSkills categories (561 skills)"
categories = []   # empty list = no category filter, installs everything
