# claude/plugins.toml — Declarative Claude Code plugin and MCP server configuration.
#
# This is the single source of truth for all managed Claude integrations.
# Edit here to add, remove, or change integrations.
#
# Integration types:
#   "plugin"     Installed via:  claude plugin install <name>@<marketplace> --scope user
#   "mcp-http"   Configured via: claude mcp add --transport http --scope user <name> <url>
#   "mcp-stdio"  Configured via: claude mcp add --transport stdio --scope user <name> -- <cmd> [args]
#
# Note on claude.ai connectors: PubMed, Synapse, bioRxiv, and Open Targets also
# auto-sync to Claude Code as remote connectors when you are logged in at claude.ai.
# The plugin versions below also work in API-key environments without claude.ai OAuth.
#
# NOT managed here (handled elsewhere):
#   ~/.claude/CLAUDE.md    — managed by the dotfiles symlink system (profiles.toml)
#   ~/.claude/settings.json — managed by the dotfiles symlink system
#   /code-review skill     — built-in Claude Code slash command, no install needed

# ── Marketplaces ─────────────────────────────────────────────────────────────
# Marketplaces to register before installing plugins from them.
# key = local alias used in integration entries, value = GitHub owner/repo path.
[marketplaces]
life-sciences = "anthropics/life-sciences"

# ── Default group ─────────────────────────────────────────────────────────────
# Core integrations suitable for all supported environments:
#   macOS, Linux, GitHub Codespaces, Code Ocean, HPC/cluster
[groups.default]
description = "Core integrations for all supported environments"

[[groups.default.integrations]]
name        = "github"
type        = "plugin"
marketplace = "claude-plugins-official"
description = "GitHub MCP — repository access, issues, PRs, code search"
auth_hint   = "GH_TOKEN or: gh auth login"

[[groups.default.integrations]]
name        = "pubmed"
type        = "plugin"
marketplace = "life-sciences"
description = "PubMed — biomedical literature search (NCBI)"
# Also available as a claude.ai connector when authenticated at claude.ai

[[groups.default.integrations]]
name        = "synapse"
type        = "plugin"
marketplace = "life-sciences"
description = "Synapse (Sage Bionetworks) — collaborative research data platform"
auth_hint   = "SYNAPSE_AUTH_TOKEN or: synapse login"
# Also available as a claude.ai connector when authenticated at claude.ai

[[groups.default.integrations]]
name        = "context7"
type        = "mcp-http"
url         = "https://mcp.context7.com/mcp"
description = "Context7 — up-to-date library documentation (no auth required)"

[[groups.default.integrations]]
name        = "pyright-lsp"
type        = "plugin"
marketplace = "claude-plugins-official"
description = "Pyright LSP — Python type checking and in-editor diagnostics"
# Requires: npm install -g pyright  (provides pyright-langserver binary)

# ── Bioinformatics group ──────────────────────────────────────────────────────
# Computational biology and life-science integrations.
# Install with: dotfiles claude setup --with bioinformatics
[groups.bioinformatics]
description = "Computational biology and life-science integrations"

[[groups.bioinformatics.integrations]]
name        = "biorxiv"
type        = "plugin"
marketplace = "life-sciences"
description = "bioRxiv/medRxiv — preprint search and retrieval"
# Also available as a claude.ai connector when authenticated at claude.ai

[[groups.bioinformatics.integrations]]
name        = "open-targets"
type        = "plugin"
marketplace = "life-sciences"
description = "Open Targets — gene–disease–drug association platform"
# Also available as a claude.ai connector when authenticated at claude.ai

[[groups.bioinformatics.integrations]]
name        = "tooluniverse"
type        = "mcp-stdio"
command     = "tooluniverse"
args        = []
description = "ToolUniverse — 600+ scientific bioinformatics tools (Harvard Zitnik Lab)"
# Requires the tooluniverse binary on PATH.
# Install: see https://zitniklab.hms.harvard.edu/ToolUniverse/ for current instructions.

[[groups.bioinformatics.integrations]]
name        = "scvi-tools"
type        = "plugin"
marketplace = "life-sciences"
description = "scvi-tools — scVI, scANVI, totalVI, PeakVI, MultiVI workflow skills"

[[groups.bioinformatics.integrations]]
name        = "single-cell-rna-qc"
type        = "plugin"
marketplace = "life-sciences"
description = "single-cell-rna-qc — MAD-based quality filtering workflow skills"

[[groups.bioinformatics.integrations]]
name        = "nextflow-development"
type        = "plugin"
marketplace = "life-sciences"
description = "Nextflow Development — nf-core pipeline execution skills"

[[groups.bioinformatics.integrations]]
name        = "scientific-problem-selection"
type        = "plugin"
marketplace = "life-sciences"
description = "Scientific Problem Selection — research ideation and risk assessment skills"

# ── Intentionally NOT installed ───────────────────────────────────────────────
# The following are available in the life-sciences marketplace but are excluded:
#   10x-genomics   — not needed for this workflow
#   consensus      — not needed for this workflow
#   chembl         — not needed for this workflow (available as claude.ai connector only)
