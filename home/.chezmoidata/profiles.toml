# Flattened profile inheritance.
#
# The previous implementation resolved this graph at runtime
# (the former Python installer — recursive collect, dedup-by-dst, orphan and
# merge-conflict validation, ~60 lines). With six profiles the transitive
# closure is more readable written out than computed.
#
# Order is parent-first, matching the old depth-first resolution order.

[layers]
    common    = ["common"]
    macos     = ["common", "macos"]
    linux     = ["common", "linux"]
    cluster   = ["common", "linux", "cluster"]
    codeocean = ["common", "linux", "codeocean"]
    codespace = ["common", "linux", "codespace"]

# Human-readable profile labels (`chezmoi data`). `common` is a composition layer rather than
# something you install directly, and is labelled as such.
[descriptions]
    common    = "Core configuration shared by all platforms (composition layer)"
    macos     = "macOS / MacBook"
    linux     = "Generic Linux workstation or server"
    cluster   = "HPC / university cluster (SLURM, PBS, SGE)"
    codeocean = "Code Ocean cloud workstation or container"
    codespace = "GitHub Codespaces"
